[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/polkit-agent-rs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
license = "GPL-3.0-or-later"

[workspace.dependencies]
asena-core = { path = "crates/asena-core" }
asena-widgets = { path = "crates/asena-widgets" }
asena-wayland = { path = "crates/asena-wayland" }
asena-services = { path = "crates/asena-services" }
asena-app = { path = "crates/asena-app" }
glib = "=0.20.12"
gio = "=0.20.12"
gtk = { package = "gtk4", version = "=0.9.7", features = ["v4_18"] }
adw = { package = "libadwaita", version = "=0.7.2", features = ["v1_7"] }
gtk4-layer-shell = "=0.5.0"
gtk4-session-lock = "=0.1.2"
pam-client = { package = "pam-client2", version = "=0.5.5", default-features = false }
zeroize = "=1.8.1"
greetd_ipc = "=0.10.3"
polkit-agent = { package = "polkit-agent-rs", version = "=0.3.0" }
polkit = { package = "polkit-rs", version = "=0.3.0" }
zbus = { version = "=5.5.0", default-features = false, features = ["async-io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"
anyhow = "1"
thiserror = "2"
gettext-rs = { version = "=0.7.2", features = ["gettext-system"] }
async-channel = "2"
unicode-normalization = "0.1"
wayland-client = "=0.31.11"
wayland-protocols-wlr = { version = "=0.3.9", features = ["client"] }
async-io = "=2.6.0"
futures-lite = "=2.6.1"
clap = { version = "=4.5.51", features = ["derive"] }
libpulse-binding = "=2.30.1"
libpulse-glib-binding = "=2.29.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
quick-xml = "=0.37.5"
# libapt-pkg bindings for asena-packages (K21); GPL-3.0-or-later. cxx stays at
# 1.0.198 through the MSRV-aware resolver, later releases need rustc 1.88.
rust-apt = "=0.11.3"

glib-build-tools = "=0.20.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
polkit-agent-rs = { path = "vendor/polkit-agent-rs" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
