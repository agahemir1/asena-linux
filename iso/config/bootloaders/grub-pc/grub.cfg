source /boot/grub/config.cfg

# Asena (K20): XanMod unless GRUB runs in Secure Boot lockdown, where only
# Debian's signed kernel loads. config/hooks/live/0100-asena-kernel-menu.hook.binary
# fills in the XanMod kernel version.
if [ "${lockdown}" = "y" ]; then
	set asena_kernel="@KERNEL_LIVE@"
	set asena_initrd="@INITRD_LIVE@"
else
	set asena_kernel="/live/vmlinuz-@ASENA_XANMOD@"
	set asena_initrd="/live/initrd.img-@ASENA_XANMOD@"
fi
export asena_kernel
export asena_initrd

menuentry "Asena Linux" --hotkey=l {
	linux	${asena_kernel} @APPEND_LIVE@
	initrd	${asena_initrd}
}

# K25: the default entry is Turkish; this one starts the live system in English.
menuentry "Asena Linux (English)" --hotkey=e {
	linux	${asena_kernel} @APPEND_LIVE@ locales=en_US.UTF-8 keyboard-layouts=us
	initrd	${asena_initrd}
}

submenu "Gelişmiş seçenekler" --hotkey=a {
	source /boot/grub/theme.cfg
	@LINUX_LIVE@
}

submenu "Araçlar" --hotkey=u {
	source /boot/grub/theme.cfg
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI ayarları" --hotkey=f {
			fwsetup
		}
	fi
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Önyükleme ortamını doğrula" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}

# When XanMod fails to load, boot the first advanced entry: Debian's kernel.
set fallback="2>0"
