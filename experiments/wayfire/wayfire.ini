# Isolated K13 experiment. Never installed as the Asena session configuration.
[core]
plugins = blur foreign-toplevel session-lock xdg-activation move resize place decoration ipc ipc-rules
xwayland = false

[blur]
# Dual Kawase: kawase_offset, kawase_degrade and kawase_iterations keep their defaults.
method = kawase
blur_by_default = (app_id is "asena-panel") | (app_id is "asena-menu") | (app_id is "asena-quick-settings") | (app_id is "asena-notification-center")

# The shell opens its surfaces on the first GDK monitor; wlroots announces
# HEADLESS-2 first, so it is the scale 1 output for the comparisons.
[output:HEADLESS-2]
mode = 1280x720
position = 0,0
scale = 1.0

[output:HEADLESS-1]
mode = 1280x720
position = 1280,0
scale = 2.0
