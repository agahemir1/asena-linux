<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Installed as /usr/share/dbus-1/system.d/org.asenalinux.Packages.conf.
     Everyone may call the service; it asks polkit before every change. -->
<busconfig>
  <policy user="root">
    <allow own="org.asenalinux.Packages"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.asenalinux.Packages" send_interface="org.asenalinux.Packages"/>
    <allow send_destination="org.asenalinux.Packages" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.asenalinux.Packages" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.asenalinux.Packages" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
