# Installed as /etc/default/grub.d/asena.cfg.
# Debian's kernel is built with dynamic preemption; full preemption keeps the
# signed fallback kernel responsive on the desktop (K20).
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }preempt=full"
# Boot splash (K07).
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"

# Menu titles say Asena (K07), but grub-install derives the EFI directory from
# the same variable, and Debian's signed GRUB only reads EFI/debian/grub.cfg.
# So only grub-mkconfig sees Asena; grub-install and every other reader keep
# Debian and the directory stays EFI/debian (K20, K23).
GRUB_DISTRIBUTOR=Debian
case ${0##*/} in
    grub-mkconfig) GRUB_DISTRIBUTOR=Asena ;;
esac
