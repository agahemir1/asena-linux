# Asena session configuration for Wayfire 0.9.
# asena-daemon writes the per-user copy from this file and the Asena settings;
# the [input] values and the plugin list are replaced there.

[core]
plugins = autostart command decoration place move resize grid fast-switcher foreign-toplevel session-lock xdg-activation gtk-shell shortcuts-inhibit preserve-output animate blur
vwidth = 1
vheight = 1
preferred_decoration_mode = client
xwayland = true
background_color = 0.08 0.08 0.09 1.0

[autostart]
autostart_wf_shell = false
asena = exec sh "$ASENA_AUTOSTART"

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot
binding_menu = <super> KEY_SPACE
command_menu = asenactl menu toggle
binding_quick_settings = <super> KEY_A
command_quick_settings = asenactl quick-settings toggle
binding_notifications = <super> KEY_N
command_notifications = asenactl notifications toggle
binding_screenshot = KEY_SYSRQ
command_screenshot = asenactl screenshot screen
binding_mute = KEY_MUTE
command_mute = asenactl volume mute
binding_mic_mute = KEY_MICMUTE
command_mic_mute = asenactl mic mute
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = asenactl volume up
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = asenactl volume down
repeatable_binding_brightness_up = KEY_BRIGHTNESSUP
command_brightness_up = asenactl brightness up
repeatable_binding_brightness_down = KEY_BRIGHTNESSDOWN
command_brightness_down = asenactl brightness down

[input]
xkb_layout = tr,us
xkb_options = grp:alt_shift_toggle
kb_repeat_rate = 25
kb_repeat_delay = 600
mouse_cursor_speed = 0.00
touchpad_cursor_speed = 0.00
mouse_natural_scroll = false
natural_scroll = false
tap_to_click = true
disable_touchpad_while_typing = true
cursor_theme = Adwaita
cursor_size = 24

# Dual Kawase background blur behind the shell surfaces, matched by their
# layer-shell namespaces. The shell draws translucent material only while the
# transparency preference is on; otherwise the daemon drops this plugin.
[blur]
method = kawase
blur_by_default = (app_id is "asena-panel") | (app_id is "asena-menu") | (app_id is "asena-quick-settings") | (app_id is "asena-notification-center")

# Server-side title bars for clients that ask for them (foot, Qt). Wayfire
# always draws the title text in white, so both colors stay dark. Colors are
# RGBA floats because a hash mark starts a comment in this file.
[decoration]
font = Inter
title_height = 30
border_size = 3
button_order = minimize maximize close
active_color = 0.188 0.188 0.204 1.0
inactive_color = 0.141 0.141 0.157 1.0

[animate]
open_animation = fade
close_animation = fade
fade_duration = 180ms
startup_duration = 200ms

[place]
mode = center

[fast-switcher]
activate = <alt> KEY_TAB
activate_backward = <alt> <shift> KEY_TAB
