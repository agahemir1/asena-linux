[preferred]
default=gtk
# Appearance from asena-daemon; other settings from the gtk backend.
org.freedesktop.impl.portal.Settings=asena;gtk
# gtk's Inhibit needs GNOME's session manager; Background has no other backend (K22).
org.freedesktop.impl.portal.Inhibit=asena
org.freedesktop.impl.portal.Background=asena
# Passwords of sandboxed applications (K22).
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
